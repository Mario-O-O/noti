<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis notas</title>
<meta name="theme-color" content="#e9e9e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Ubuntu",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --or:#e1502f;
  --bg:#e9e9e6;--ink:#141414;--muted:#7d7d78;--line:#d3d3ce;--acc:var(--or);--soft:rgba(20,20,20,.06);
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1);
}
html[data-th="blanco"]{--bg:#f7f7f4;--line:#e2e2dd}
html[data-th="salvia"]{--bg:#cfd8d3;--muted:#5d6a63;--line:#b7c3bc}
html[data-th="naranja"]{--bg:#e1502f;--ink:#fff;--muted:rgba(255,255,255,.78);--line:rgba(255,255,255,.32);--acc:#141414;--soft:rgba(255,255,255,.14)}
html[data-th="negro"]{--bg:#141414;--ink:#f2f2ef;--muted:#8f8f8a;--line:#2d2d2d;--acc:var(--or);--soft:rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overscroll-behavior-y:none;overflow-x:hidden;transition:background .5s var(--ease)}
body{margin:0;background:transparent;color:var(--ink);font:15px/1.5 var(--sans);font-weight:400;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:color .4s}
.wrap{max-width:500px;margin:0 auto;padding:0 26px calc(110px + env(safe-area-inset-bottom))}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;cursor:pointer;border:none;background:transparent;color:var(--ink);border-radius:99px;padding:8px 12px;font-weight:400;position:relative;overflow:hidden;transition:transform .35s var(--spring),opacity .25s,color .3s,background .3s}
button:active{transform:scale(.94);transition-duration:.08s}
input,textarea,select{font:inherit;color:inherit}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.1;transform:scale(0);pointer-events:none;animation:rip .55s var(--ease) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.it{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.or{color:var(--acc)}
.cap{display:inline-grid;place-items:center;width:40px;height:26px;border:1.4px solid currentColor;border-radius:99px;flex:0 0 auto;transition:transform .45s var(--spring),background .3s,color .3s}
.cap svg{width:18px;height:12px;stroke-width:1.6}
.star{width:22px;height:22px;color:var(--acc);animation:spin 14s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.brk{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;line-height:1.25}

/* arriba */
.bar{display:flex;justify-content:space-between;align-items:center;padding:calc(20px + env(safe-area-inset-top)) 0 0}
.bar .r{display:flex;gap:2px}
.ib{width:42px;height:42px;padding:0;display:grid;place-items:center;color:var(--ink)}
.word{display:flex;align-items:center;gap:10px}
.h1{font-size:44px;line-height:1.18;font-weight:300;letter-spacing:-.015em;margin:80px 0 26px;white-space:pre-line;animation:in .7s .1s var(--ease) both}
.h1 .it{font-size:1.08em;letter-spacing:0}
.big{display:flex;align-items:flex-end;gap:6px;margin:56px 0 4px;animation:in .7s var(--ease) both}
.big .n{font-size:112px;line-height:.9;font-weight:300;letter-spacing:-.03em}
.big .u{font-size:34px;font-weight:300;color:var(--acc);letter-spacing:0;margin:4px 0 0 6px}
.lead{font-size:26px;line-height:1.3;margin:26px 0 30px;animation:in .7s .15s var(--ease) both}
.go{display:flex;align-items:center;gap:16px;padding:6px 0;font-size:14.5px;text-align:left;border-radius:0;animation:in .7s .25s var(--ease) both}
.go:active .cap,.go:hover .cap{transform:translateX(5px);background:var(--ink);color:var(--bg)}
.go span{line-height:1.3}
.search{overflow:hidden;max-height:0;opacity:0;transition:max-height .45s var(--ease),opacity .3s,margin .45s var(--ease)}
.search.on{max-height:70px;opacity:1;margin:20px 0 0}
.search input{width:100%;background:transparent;border:none;border-bottom:1.4px solid var(--ink);padding:10px 0;outline:none;font-size:17px;font-weight:300}

/* filtros */
.tabs{display:flex;gap:8px;margin:44px -26px 4px;padding:0 26px;overflow-x:auto;scrollbar-width:none;animation:in .6s .35s var(--ease) both}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:7px 14px;border:1.2px solid var(--line);color:var(--muted);font-size:13px;flex:0 0 auto;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tabs sup{font-size:9.5px;margin-left:3px}

/* lista */
.row{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer;opacity:0;animation:in .5s var(--ease) forwards;animation-delay:calc(var(--i,0) * 45ms + .4s)}
.row .tt{flex:1;min-width:0}
.row b{display:block;font-weight:400;font-size:17.5px;letter-spacing:0;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#9a9a95);flex:0 0 auto}
.row .dot.off{opacity:.4}
.row .cap{color:var(--muted)}
.row:active .cap{transform:translateX(5px);color:var(--ink)}
.row .th{width:40px;height:40px;border-radius:8px;overflow:hidden;flex:0 0 auto}
.row .th img{width:100%;height:100%;object-fit:cover;filter:grayscale(.2)}
.hoy{display:inline-block;background:var(--or);border-radius:99px;padding:0 7px;color:#fff;font-weight:500}
.empty{color:var(--muted);padding:28px 0;font-size:14px}
.fab{position:fixed;right:max(22px,calc(50% - 228px));bottom:calc(22px + env(safe-area-inset-bottom));z-index:7;width:60px;height:60px;border-radius:50%;background:var(--or);color:#fff;padding:0;display:grid;place-items:center;box-shadow:0 12px 24px -12px rgba(225,80,47,.7);animation:pop .6s .5s var(--spring) both}
.fab svg{width:24px;height:24px}
@keyframes pop{from{transform:scale(0)}}

/* crear (pantalla negra) */
.crear .h1{margin-top:110px}
.etitle{min-height:1.2em}
.oval{position:relative;display:inline-block}
.oval svg{position:absolute;left:-10%;top:-18%;width:120%;height:140%;overflow:visible;pointer-events:none}
.oval path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1s .6s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.opts{margin-top:30px;display:grid;gap:4px}
.opts .go{animation-delay:calc(var(--i) * 80ms + .3s);padding:14px 0;border-bottom:1px solid var(--line);gap:18px}
.opts .go b{display:block;font-size:22px;font-weight:300;letter-spacing:0;line-height:1.3}
.opts .go small{color:var(--muted);font-size:13px}
.opts .go .cap{color:var(--acc)}
.foot{display:flex;align-items:center;gap:10px;margin-top:44px;color:var(--muted);font-size:13px;animation:in .6s .8s var(--ease) both}

/* editor */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 0 0}
.circ{width:42px;height:42px;padding:0;display:grid;place-items:center;color:var(--ink)}
.top h1,.top .sub{display:none}
.etitle{width:100%;border:none;background:transparent;outline:none;resize:none;font-size:40px;line-height:1.2;font-weight:300;letter-spacing:-.01em;margin:56px 0 20px;padding:0;overflow:hidden;color:var(--ink)}
.ebody{width:100%;border:none;background:transparent;outline:none;resize:none;font-size:16.5px;line-height:1.65;padding:0;min-height:80px;overflow:hidden;color:var(--ink);opacity:.85}
.copyw{display:flex;justify-content:flex-end;margin-top:4px}
.copy{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border:1.2px solid var(--line);color:var(--muted);font-size:12.5px;letter-spacing:.02em}
.copy svg{width:15px;height:15px}
.copy.hecho{color:var(--acc);border-color:var(--acc)}
.etitle::placeholder,.ebody::placeholder{color:var(--muted);opacity:.7}
.esec{margin-top:26px;animation:in .5s var(--ease) both}
.esec h4{margin:0 0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.esec h4::before{content:"[ "}.esec h4::after{content:" ]"}
.eitem{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);animation:in .35s var(--ease) both}
.eitem .cb{width:22px;height:22px;border-radius:50%;border:1.3px solid var(--muted);flex:0 0 auto;padding:0;display:grid;place-items:center;transition:background .3s,border-color .3s,transform .4s var(--spring)}
.eitem .cb svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4;fill:none;stroke-dasharray:20;stroke-dashoffset:20}
.eitem.ok .cb{background:var(--acc);border-color:var(--acc)}
.eitem.ok .cb svg{animation:check .35s .05s var(--ease) forwards}
.eitem.ok .cb.just{animation:boing .45s var(--spring)}
@keyframes check{to{stroke-dashoffset:0}}
@keyframes boing{40%{transform:scale(1.25)}}
.eitem input{flex:1;border:none;background:transparent;outline:none;font-size:16px;padding:14px 0;min-width:0;background-image:linear-gradient(var(--muted),var(--muted));background-size:0 1px;background-repeat:no-repeat;background-position:0 54%;transition:background-size .4s var(--ease),color .3s}
.eitem.ok input{background-size:100% 1px;color:var(--muted)}
.eitem .x{padding:6px;color:var(--muted)}
.addline{color:var(--muted);padding:14px 0 0;font-size:14px;border-radius:0}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.photos .p{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;animation:in .45s var(--ease) both}
.photos img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photos .x{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);color:#141414;padding:0;display:grid;place-items:center}
.rem{background:var(--soft);border-radius:18px;padding:16px 18px;margin-left:-4px;margin-right:-4px}
.rem .big2{font-size:28px;font-weight:300;letter-spacing:0;line-height:1.25;margin:6px 0 10px}
.lr{display:flex;align-items:baseline;gap:10px;padding:8px 0}
.lr .ic{align-self:center;display:grid;color:var(--muted)}
.lr .ic svg{width:17px;height:17px}
.lr .nm{white-space:nowrap}
.lr .dots{flex:1;min-width:16px;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.lr .vl{font-weight:500;white-space:nowrap}
.rem input{border:none;background:transparent;outline:none;font-weight:500;text-align:right;padding:0;font-size:15px;min-width:0;color-scheme:light}
html[data-th="negro"] .rem input,html[data-th="naranja"] .rem input{color-scheme:dark}
.rsel{border:none;background:transparent;outline:none;font-weight:500;text-align:right;padding:0;appearance:none;-webkit-appearance:none;cursor:pointer}
.rsel option{color:#141414}
.rem .cal{width:100%;margin-top:12px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:99px}
@keyframes llama{0%,100%{box-shadow:0 0 0 0 rgba(225,80,47,0)}40%{box-shadow:0 0 0 8px rgba(225,80,47,.35)}}
.rem .cal.llama{animation:llama .9s var(--ease) 2}
.rem .alt{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.rem .alt button{padding:6px 0;font-size:12.5px;color:var(--muted)}
.rem p{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.small{font-size:13px}.muted{color:var(--muted)}
.tones{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.tones button{width:26px;height:26px;border-radius:50%;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tones button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.del{color:var(--muted);margin-top:30px;padding:8px 0;font-size:13.5px;border-radius:0;text-decoration:underline;text-underline-offset:3px}
.edbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:7;width:min(100%,500px);display:flex;align-items:center;justify-content:space-between;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.edbar .l{display:flex;gap:2px}
.edbar .l button{width:44px;height:44px;padding:0;display:grid;place-items:center;color:var(--ink);opacity:.8}
.edbar .done{display:flex;align-items:center;gap:12px;font-size:15px;padding:10px 0 10px 12px}
.edbar .done:active .cap{transform:translateX(5px);background:var(--ink);color:var(--bg)}
.hbtn.on svg{fill:var(--hc,var(--acc));stroke:var(--hc,var(--acc))}
html[data-th="naranja"] .hbtn.on svg,html[data-th="negro"] .hbtn.on svg{fill:currentColor;stroke:currentColor}
svg.i.hmini{width:17px;height:17px;fill:currentColor;stroke:currentColor;stroke-width:1.2;vertical-align:-2px;margin-right:7px}
.hbtn.pop svg{animation:hp .5s var(--spring)}
@keyframes hp{30%{transform:scale(1.4)}}
.spark{position:fixed;width:5px;height:5px;border-radius:50%;background:var(--or);pointer-events:none;z-index:30;animation:spark .6s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* ajustes */
.card{padding:20px 0;border-bottom:1px solid var(--line);animation:in .5s var(--ease) both}
.card h2{margin:0 0 10px;font-weight:300;font-size:24px;letter-spacing:0;line-height:1.25}
.btns{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.ghin{display:block;width:100%;background:transparent;border:none;border-bottom:1.2px solid var(--ink);padding:9px 0;margin:2px 0 12px;outline:none;font-size:15px}
label.small{display:block;margin-top:6px}
.pri,.btnlike{display:inline-flex;align-items:center;gap:10px;font-weight:500;padding:8px 0;cursor:pointer;position:relative}
.pri::after,.btnlike::after{content:"→"}

.viewer{position:fixed;inset:0;background:rgba(20,20,20,.96);z-index:20;display:grid;place-items:center;padding:20px;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.viewer img{max-width:100%;max-height:100%;border-radius:12px;animation:zoom .4s var(--spring)}
@keyframes zoom{from{transform:scale(.9);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:21;background:var(--ink);color:var(--bg);font-size:13.5px;padding:10px 16px;border-radius:99px;
  transform:translate(-50%,20px) scale(.94);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#view{animation:page .45s var(--ease)}
@keyframes page{from{opacity:0}}
.leaving{animation:out .28s var(--ease) forwards!important}
@keyframes out{to{opacity:0;height:0;padding:0;margin:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}.row{opacity:1}}

/* crear: tarjetas de color */
.crear .h1{margin-top:64px}
.crear .oval svg path{stroke:var(--or);stroke-width:2}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}
.tc{border-radius:28px;padding:16px 16px 18px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;overflow:hidden;
  opacity:0;transform:translateY(18px);animation:tin .55s var(--ease) forwards;animation-delay:calc(var(--i) * 70ms + .15s);transition:transform .2s var(--ease),filter .2s}
@keyframes tin{to{opacity:1;transform:none}}
.tc:active{transform:scale(.98)!important;filter:brightness(.96)}
.tc .hd{display:flex;justify-content:space-between;align-items:flex-start}
.tc .num{font-size:12px;letter-spacing:.08em;font-weight:500;opacity:.7}
.tc .ico svg{width:30px;height:30px;stroke-width:1.3;margin-top:22px}
.tc b{display:block;font-size:27px;font-weight:300;line-height:1.15;letter-spacing:-.01em;margin-top:auto}
.tc small{display:block;font-size:12.5px;opacity:.72;margin-top:4px;line-height:1.35}
.tc .cap{transition:transform .45s var(--spring)}
.tc:active .cap{transform:translateX(3px)}
.tc.salvia{background:#cfd8d3;color:#141414}
.tc.blanco{background:#f7f7f4;color:#141414}
.tc.naranja{background:var(--or);color:#fff}
.tc.negro{background:#262626;color:#f2f2ef;box-shadow:inset 0 0 0 1px #333}
.tc.negro .cap,.tc.naranja .cap{color:inherit}
.tc .deco{position:absolute;right:-24px;top:-24px;width:78px;height:78px;opacity:.55;animation:spin 18s linear infinite;z-index:0}
.tc>*:not(.deco){position:relative;z-index:1}
.tc.naranja .deco{color:#ffb39e}.tc.negro .deco{color:var(--or)}

/* cajas de distintos tamaños con formas que giran */
.grid4{grid-template-columns:1fr 1fr;grid-template-rows:152px 152px 150px;grid-template-areas:"nota lista" "nota aviso" "foto foto"}
.tc{min-height:0;padding:16px}
.tc.a-nota{grid-area:nota}.tc.a-lista{grid-area:lista}.tc.a-aviso{grid-area:aviso}.tc.a-foto{grid-area:foto;flex-direction:row;align-items:flex-end}
.tc b{font-size:25px}
.tc .hd{align-items:flex-start}
.shape{position:relative;width:var(--s,62px);height:var(--s,62px);display:grid;place-items:center;flex:0 0 auto}
.shape svg.sh{position:absolute;inset:0;width:100%;height:100%;animation:spin var(--t,22s) linear infinite;animation-direction:var(--dir,normal)}
.shape .i{position:relative;width:calc(var(--s,62px) * .36);height:calc(var(--s,62px) * .36);stroke-width:1.6}
.tc.a-nota .shape{--s:clamp(70px,22vw,96px)}
.tc .hd .cap{flex:0 0 auto}
.tc .hd{gap:6px}
.tc.a-foto .shape{--s:92px;margin-left:auto;align-self:center}
.tc.a-foto .txt{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.tc.a-foto .txt .cap{margin-bottom:auto}
.tc small{max-width:170px}
.tc.a-lista small,.tc.a-aviso small{display:none}
</style>
</head>
<body>
<div class="wrap"><main id="view"></main></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" class="vh" aria-hidden="true">
<input type="file" id="galIn" accept="image/*" multiple class="vh" aria-hidden="true">
<script>
(function(){
"use strict";
// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";

  return e;
}
function icon(parts, fill){
  const s = document.createElementNS(SVGNS,"svg"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("class","i");
  if (fill){ s.style.fill = "currentColor"; s.style.stroke = "none"; }
  parts.forEach(([t,a]) => { const n = document.createElementNS(SVGNS,t); for (const k in a) n.setAttribute(k,a[k]); s.append(n); });
  return s;
}
const IC = {
  plus: () => icon([["path",{d:"M12 5v14M5 12h14"}]]),

  if (n.repite === "diario") return new Date(y, m-1, d + k, hh, mm);

  if (n.repite === "mensual"){ const ult = new Date(y, m-1+k+1, 0).getDate(); return new Date(y, m-1+k, Math.min(d, ult), hh, mm); }
  if (n.repite === "anual"){ const ult = new Date(y+k, m, 0).getDate(); return new Date(y+k, m-1, Math.min(d, ult), hh, mm); }

    el("p",{class:"small muted",style:"margin:0",text:"Los avisos los hace el calendario de tu celular. Al poner una fecha en una nota, toca “Agregar al calendario” y guarda el evento. Para que suene a la hora exacta, en Google Calendar ve a Configuración → tu cuenta → Notificaciones de eventos y elige “A la hora del evento”."})));
}

// ---------- sincronización con GitHub (mismo repositorio privado que finanzas) ----------
const K_GH = "notas:github", K_TS = "notas:guardado", K_SUB = "notas:fotos-subidas";
const ghCfg = () => { try { return JSON.parse(localStorage.getItem(K_GH) || "null"); } catch(e){ return null; } };
const ghSet = c => { try { localStorage.setItem(K_GH, JSON.stringify(c)); } catch(e){} };
const tsLocal = () => { try { return localStorage.getItem(K_TS) || ""; } catch(e){ return ""; } };
const subidas = () => { try { return new Set(JSON.parse(localStorage.getItem(K_SUB) || "[]")); } catch(e){ return new Set(); } };
const guardarSubidas = st => { try { localStorage.setItem(K_SUB, JSON.stringify([...st])); } catch(e){} };
let ghEstado = "", ghTimer = null, ghOcupado = false;
function marcarCambio(){
  try { localStorage.setItem(K_TS, new Date().toISOString()); } catch(e){}
  const c = ghCfg(); if (!c || !c.token) return;
  c.pendiente = true; ghSet(c);
  clearTimeout(ghTimer); ghTimer = setTimeout(ghSubir, 4000);
}
const b64enc = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = b => Uint8Array.from(atob(b.replace(/\s/g,"")), c => c.charCodeAt(0));
async function ghApi(c, ruta, method, body, raw){
  const r = await fetch("https://api.github.com/repos/" + c.repo + "/contents/" + ruta, {method, cache:"no-store",
    headers:{"Authorization":"Bearer " + c.token, "Accept": raw ? "application/vnd.github.raw" : "application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"},
    body: body ? JSON.stringify(body) : undefined});
  if (r.status === 404 && method === "GET") return null;
  if (!r.ok){ const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
  return raw ? r.blob() : r.json();
}
function ghError(e){
  if (!navigator.onLine) return "Sin internet: se sube cuando vuelvas a tener conexión";
  if (e.status === 401) return "La llave no sirve o venció. Crea una nueva";
  if (e.status === 403 || e.status === 404) return "Sin permiso: revisa el repositorio y los permisos de la llave";
  return "No se pudo sincronizar (" + (e.message || "error") + ")";
}
async function ghLeer(c){
  const r = await ghApi(c, "notas.json", "GET");
  if (!r) return null;
  return {sha: r.sha, data: JSON.parse(new TextDecoder().decode(b64dec(r.content)))};
}
async function ghSubirFotos(c){
  const ya = subidas();
  for (const n of notas) for (const id of n.fotos){
    if (ya.has(id)) continue;
    const b = await fotoGet(id).catch(() => null); if (!b) continue;
    const ruta = "notas-fotos/" + id + ".jpg";
    let sha; try { const ex = await ghApi(c, ruta, "GET"); sha = ex && ex.sha; } catch(e){}
    if (!sha) await ghApi(c, ruta, "PUT", {message:"Foto de nota", content: b64enc(new Uint8Array(await b.arrayBuffer()))});
    ya.add(id); guardarSubidas(ya);
  }
}
async function ghBajarFoto(id){
  const c = ghCfg(); if (!c || !c.token || !navigator.onLine) return null;
  try { const b = await ghApi(c, "notas-fotos/" + id + ".jpg", "GET", null, true); if (b){ await fotoPut(id, b); const st = subidas(); st.add(id); guardarSubidas(st); } return b; }
  catch(e){ return null; }
}
async function ghSubir(){
  const c = ghCfg(); if (!c || !c.token || ghOcupado) return;
  if (!navigator.onLine){ ghEstado = "Sin internet: se sube cuando vuelvas a tener conexión"; return; }
  ghOcupado = true;
  try {
    await ghSubirFotos(c);
    const payload = {app:"misnotas", v:1, notas: notas.filter(n => !vacia(n)), guardadoEn: tsLocal()};
    const put = sha => ghApi(c, "notas.json", "PUT", {message:"Notas actualizadas " + new Date().toLocaleString("es-CO"), content: b64enc(new TextEncoder().encode(JSON.stringify(payload, null, 1))), sha: sha || undefined});
    let res;
    try { res = await put(c.sha); }
    catch(e){ if (e.status === 409 || e.status === 422){ const rem = await ghLeer(c); res = await put(rem && rem.sha); } else throw e; }
    c.sha = res.content.sha; c.ultima = new Date().toISOString(); c.pendiente = false; ghSet(c); ghEstado = "";
  } catch(e){ c.pendiente = true; ghSet(c); ghEstado = ghError(e); }
  finally { ghOcupado = false; if (ruta().ajustes) render(); }
}
// trae las notas del servidor si son más nuevas que las del celular
async function ghBajar(silencioso){
  const c = ghCfg(); if (!c || !c.token || ghOcupado || !navigator.onLine) return false;
  ghOcupado = true;
  try {
    const rem = await ghLeer(c);
    if (!rem){ ghOcupado = false; await ghSubir(); return false; }
    c.sha = rem.sha; ghSet(c);
    const remTs = rem.data.guardadoEn || "", locTs = tsLocal();
    const localVacio = !notas.some(n => !vacia(n));
    if (Array.isArray(rem.data.notas) && (localVacio || (remTs > locTs && !c.pendiente))){
      aplicandoRemoto = true;
      const ids = new Set(rem.data.notas.map(n => n.id));
      for (const n of notas) if (!ids.has(n.id)) await dbDel(n.id);
      for (const n of rem.data.notas) await dbPut(n);
      aplicandoRemoto = false;
      notas = await dbAll();
      notas.forEach(n => { n.items = n.items || []; n.fotos = n.fotos || []; });
      try { localStorage.setItem(K_TS, remTs || new Date().toISOString()); } catch(e){}
      const st = subidas(); notas.forEach(n => n.fotos.forEach(id => st.add(id))); guardarSubidas(st);   // las fotos remotas ya están en GitHub
      c.ultima = new Date().toISOString(); ghSet(c); ghEstado = "";
      if (!silencioso) toast("Notas actualizadas desde GitHub");
      ghOcupado = false; if (!ruta().nota) render(); return true;
    }
    ghOcupado = false;
    if (c.pendiente || locTs > remTs) await ghSubir();
    return false;
  } catch(e){ aplicandoRemoto = false; ghEstado = ghError(e); ghOcupado = false; return false; }
}
window.addEventListener("online", () => { const c = ghCfg(); if (c && c.pendiente) ghSubir(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !ruta().nota) ghBajar(true); });

// ---------- inicio ----------
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  try { notas = await dbAll(); } catch(e){ notas = []; toast("No se pudo abrir el almacenamiento"); }
  notas.forEach(n => { n.items = n.items || []; n.fotos = n.fotos || []; if (VIEJOS[n.color]) n.color = VIEJOS[n.color]; if (!COLORES.includes(n.color)) n.color = "blanco"; });
  if (ruta().nota && !notas.some(n => n.id === ruta().nota)) location.hash = "";
  render();
  const c = ghCfg(); if (c && c.token) ghBajar(true);
})();
})();
